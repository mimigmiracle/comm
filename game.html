<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Whats Survival | Live Elimination Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b141a;
            --card-bg: #111b21;
            --accent-gold: #ffd700;
            --text-main: #e9edef;
            --text-sub: #8696a0;
            --success: #00a884;
            --danger: #f15c6d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 28px 20px;
            text-align: center;
        }

        .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
        .header p { font-size: 13px; color: var(--text-sub); }

        .stat-box {
            background: #182229;
            border: 1px dashed rgba(255, 215, 0, 0.3);
            border-radius: 14px;
            padding: 16px;
        }

        .stat-label { font-size: 12px; color: var(--text-sub); text-transform: uppercase; }
        .stat-count { font-size: 32px; font-weight: 800; color: var(--accent-gold); margin-top: 4px; }

        .btn-eliminate {
            width: 100%;
            padding: 22px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 18px;
            background: linear-gradient(135deg, #f15c6d, #d9384a);
            color: #ffffff;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(241, 92, 109, 0.4);
            transition: transform 0.1s ease, background 0.2s ease;
        }

        .btn-eliminate:active { transform: scale(0.96); }
        .btn-eliminate:disabled { 
            background: #222d34; 
            color: var(--text-sub); 
            box-shadow: none; 
            cursor: not-allowed; 
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .feed-box {
            background: #182229;
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            color: var(--text-sub);
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-screen { display: none; flex-direction: column; gap: 14px; }

        .btn-claim {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            background: var(--success);
            color: #fff;
            text-decoration: none;
            display: block;
            box-shadow: 0 4px 15px rgba(0, 168, 132, 0.4);
        }

        .btn-restart {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            background: transparent;
            color: var(--text-sub);
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>⚔️ Whats Survival</h1>
        <p>Tap button to eliminate rival players live!</p>
    </div>

    <!-- Active Game Area -->
    <div id="game-active-area" style="display: flex; flex-direction: column; gap: 16px;">
        <div class="stat-box">
            <div class="stat-label">Players Remaining in Lobby</div>
            <div class="stat-count" id="active-count">--</div>
        </div>

        <button class="btn-eliminate" id="btn-eliminate" onclick="eliminateRival()">
            REMOVE A PLAYER ⚔️
        </button>

        <div class="feed-box" id="feed-msg">
            Battle in progress... Stay quick on the button!
        </div>
    </div>

    <!-- End Game Result Area -->
    <div class="result-screen" id="result-screen">
        <h2 id="result-title"></h2>
        <p id="result-desc" style="font-size: 13px; color: var(--text-sub);"></p>
        <a href="#" class="btn-claim" id="btn-claim" style="display: none;" target="_blank">
            CLAIM PRIZE ON WHATSAPP 🏆
        </a>
        <button class="btn-restart" onclick="window.location.href='login.html'">
            RETURN TO LOBBY 🔄
        </button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://eupaqmrilobhvmbpvpuw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_PjtLrDn-bHNoz9hm5FM_yQ_LI8NUxrU';
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const userPhone = localStorage.getItem('user_phone') || '';
    let isBusy = false;
    let matchOver = false;

    // Sync Game State with Database
    async function syncGameState() {
        if (matchOver || !userPhone) return;

        const { data: activePlayers } = await dbClient
            .from('leads')
            .select('phone_number')
            .eq('is_active', true);

        if (!activePlayers) return;

        const count = activePlayers.length;
        document.getElementById('active-count').innerText = count;

        const amIStillActive = activePlayers.some(p => p.phone_number === userPhone);

        // RULE 1: If eliminated by someone else, block immediately
        if (!amIStillActive) {
            endMatch(false);
            return;
        }

        // RULE 3: If only 1 player remains and it's you, trigger victory screen
        if (count === 1 && amIStillActive) {
            endMatch(true);
        }
    }

    // "REMOVE A PLAYER" Action
    async function eliminateRival() {
        if (isBusy || matchOver) return;

        // Double check active status before allowing removal action
        const { data: selfStatus } = await dbClient
            .from('leads')
            .select('is_active')
            .eq('phone_number', userPhone)
            .maybeSingle();

        if (!selfStatus || selfStatus.is_active !== true) {
            endMatch(false);
            return;
        }

        isBusy = true;
        const btn = document.getElementById('btn-eliminate');
        const feed = document.getElementById('feed-msg');

        // Fetch opponents remaining
        const { data: opponents } = await dbClient
            .from('leads')
            .select('phone_number')
            .eq('is_active', true)
            .neq('phone_number', userPhone);

        if (opponents && opponents.length > 0) {
            const target = opponents[Math.floor(Math.random() * opponents.length)];

            await dbClient
                .from('leads')
                .update({ is_active: false })
                .eq('phone_number', target.phone_number);

            const maskedTarget = target.phone_number.slice(0, 5) + '***' + target.phone_number.slice(-2);
            feed.innerText = `⚔️ You knocked out +${maskedTarget}!`;
        } else {
            feed.innerText = "No active rivals remaining!";
        }

        // RULE 2: Start 3-Second Cooldown Timer
        let cooldownSeconds = 3;
        btn.disabled = true;
        btn.innerText = `WAIT (${cooldownSeconds}s)... ⏳`;

        const cooldownInterval = setInterval(() => {
            cooldownSeconds--;
            if (cooldownSeconds > 0) {
                btn.innerText = `WAIT (${cooldownSeconds}s)... ⏳`;
            } else {
                clearInterval(cooldownInterval);
                btn.disabled = false;
                btn.innerText = "REMOVE A PLAYER ⚔️";
                isBusy = false;
                syncGameState();
            }
        }, 1000);
    }

    function endMatch(isWinner) {
        matchOver = true;
        document.getElementById('game-active-area').style.display = 'none';

        const screen = document.getElementById('result-screen');
        const title = document.getElementById('result-title');
        const desc = document.getElementById('result-desc');
        const claimBtn = document.getElementById('btn-claim');

        screen.style.display = 'flex';

        if (isWinner) {
            title.innerText = "🏆 VICTORY! YOU SURVIVED";
            title.style.color = "var(--accent-gold)";
            desc.innerText = "You are the last survivor standing in the lobby!";
            claimBtn.style.display = "block";
            claimBtn.href = `https://wa.me/2348124427349?text=Hello%20Admin,%20I%20won%20the%20Whats%20Survival%20match!%20My%20Phone:%20%2B${userPhone}`;
        } else {
            title.innerText = "💀 YOU WERE REMOVED";
            title.style.color = "var(--danger)";
            desc.innerText = "You were knocked out of the lobby and cannot remove anyone else.";
        }
    }

    syncGameState();
    setInterval(syncGameState, 1500);
</script>

</body>
</html>
