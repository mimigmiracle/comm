<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Survival Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wa-bg: #0b141a;
            --wa-card: #111b21;
            --wa-header: #202c33;
            --wa-text: #e9edef;
            --wa-subtext: #8696a0;
            --wa-green: #00a884;
            --wa-red: #f15c6d;
            --wa-divider: #222d34;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--wa-bg);
            color: var(--wa-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .wa-screen {
            width: 100%;
            max-width: 440px;
            background: var(--wa-card);
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .wa-top-bar {
            background: var(--wa-header);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .back-btn { color: var(--wa-subtext); text-decoration: none; font-size: 20px; }
        .group-name { font-size: 16px; font-weight: 600; color: var(--wa-text); }
        .group-meta { font-size: 12px; color: var(--wa-subtext); }

        .wa-tabs {
            display: flex;
            background: var(--wa-header);
            border-bottom: 1px solid var(--wa-divider);
        }

        .wa-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--wa-green);
            border-bottom: 3px solid var(--wa-green);
        }

        .members-list {
            display: flex;
            flex-direction: column;
            padding: 8px 0;
        }

        .member-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.2s;
        }

        .member-item:active { background: #1f2c34; }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #6b7c85;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #ffffff;
            flex-shrink: 0;
        }

        .member-info { display: flex; flex-direction: column; flex-grow: 1; word-break: break-all; }
        .member-phone { font-size: 14px; font-weight: 500; color: var(--wa-text); }

        .winner-screen {
            background: rgba(0, 168, 132, 0.08);
            border: 2px solid var(--wa-green);
            border-radius: 16px;
            margin: 24px 16px;
            padding: 24px 16px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .trophy-icon { font-size: 50px; }
        .winner-title { color: var(--wa-green); font-weight: 800; font-size: 20px; }
        .winner-phone { font-size: 15px; font-weight: 700; background: #1f2c34; padding: 12px; border-radius: 10px; width: 100%; border: 1px solid var(--wa-divider); word-break: break-all; }

        .btn-claim {
            background: var(--wa-green);
            color: #000000;
            text-decoration: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            width: 100%;
            display: block;
            box-shadow: 0 4px 12px rgba(0, 168, 132, 0.3);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: flex-end;
            flex-direction: column;
            z-index: 100;
        }

        .sheet-card {
            background: #1f2c34;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            animation: slideUp 0.2s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .sheet-profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--wa-divider);
        }

        .sheet-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #e2a03f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .sheet-phone { font-size: 15px; font-weight: 700; color: var(--wa-text); word-break: break-all; text-align: center; }

        .sheet-menu-item {
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            border-radius: 10px;
            background: rgba(241, 92, 109, 0.1);
            color: var(--wa-red);
        }

        .confirm-card {
            background: #1f2c34;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .confirm-text { font-size: 15px; color: var(--wa-text); }
        .confirm-btns { display: flex; justify-content: flex-end; gap: 16px; }
        .confirm-btn { background: none; border: none; font-size: 14px; font-weight: 700; cursor: pointer; }
        .btn-cancel { color: var(--wa-subtext); }
        .btn-remove { color: var(--wa-red); }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #202c33;
            color: var(--wa-text);
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--wa-divider);
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            display: none;
            z-index: 200;
            text-align: center;
            width: 85%;
            max-width: 380px;
        }
    </style>
</head>
<body>

<div class="wa-screen">
    <div class="wa-top-bar">
        <a href="index.html" class="back-btn">←</a>
        <div>
            <div class="group-name" id="arena-title">Whats Survival Lobby</div>
            <div class="group-meta" id="member-count">0 members</div>
        </div>
    </div>

    <div class="wa-tabs">
        <div class="wa-tab">Members</div>
    </div>

    <div id="winner-container" style="display: none;"></div>

    <div class="members-list" id="members-list">
        <div style="color: var(--wa-subtext); padding: 20px; text-align: center; font-size: 13px;">Loading players...</div>
    </div>
</div>

<div class="modal-overlay" id="option-modal" onclick="closeModals(event)">
    <div class="sheet-card" onclick="event.stopPropagation()">
        <div class="sheet-profile">
            <div class="sheet-avatar">👤</div>
            <div class="sheet-phone" id="modal-phone">+234 ...</div>
        </div>

        <div class="sheet-menu-item" onclick="openConfirmModal()">
            ⛔ Remove from group
        </div>
    </div>
</div>

<div class="modal-overlay" id="confirm-modal" onclick="closeModals(event)">
    <div class="confirm-card" onclick="event.stopPropagation()">
        <div class="confirm-text" id="confirm-text">Remove player from group?</div>
        <div class="confirm-btns">
            <button class="confirm-btn btn-cancel" onclick="closeConfirmModal()">Cancel</button>
            <button class="confirm-btn btn-remove" onclick="executeRemoval()">Remove</button>
        </div>
    </div>
</div>

<div class="toast" id="toast-msg">Notification</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const activePhone = localStorage.getItem('user_phone');
    if (!activePhone) {
        window.location.href = 'login.html';
    }

    const SUPABASE_URL = 'https://eupaqmrilobhvmbpvpuw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_PjtLrDn-bHNoz9hm5FM_yQ_LI8NUxrU';
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const WHATSAPP_NUMBER = "2348124427349";

    const urlParams = new URLSearchParams(window.location.search);
    const currentTier = urlParams.get('tier') || '10000';

    let selectedPlayerId = null;
    let selectedPlayerPhone = '';
    let cooldownEndTime = 0; 
    let isCurrentUserAlive = true; 

    const tierName = currentTier === '100000' ? '₦500k Grand Battle' : '₦50k Sprint Battle';
    document.getElementById('arena-title').innerText = `Whats Survival (${tierName})`;

    async function fetchPlayers() {
        const { data: players, error } = await dbClient
            .from('leads')
            .select('*')
            .eq('tier', currentTier)
            .eq('is_active', true);

        if (error || !players) return;

        renderArena(players);
    }

    function renderArena(players) {
        const listDiv = document.getElementById('members-list');
        const countMeta = document.getElementById('member-count');
        const winnerDiv = document.getElementById('winner-container');

        countMeta.innerText = `${players.length} members`;

        isCurrentUserAlive = players.some(p => String(p.phone_number) === String(activePhone));

        if (players.length === 1) {
            const winner = players[0];
            const winnerPhone = winner.phone_number || `Player #${winner.id}`;
            const isWinner = String(activePhone) === String(winnerPhone);

            listDiv.style.display = 'none';
            winnerDiv.style.display = 'block';

            if (isWinner) {
                const msg = encodeURIComponent(`Hello Admin! I won the ${tierName} on Whats Survival. My registered number is +${winnerPhone}. Please issue my prize money!`);
                winnerDiv.innerHTML = `
                    <div class="winner-screen">
                        <div class="trophy-icon">🏆</div>
                        <div class="winner-title">YOU WON!</div>
                        <div style="font-size: 13px; color: var(--wa-subtext);">You are the last remaining survivor:</div>
                        <div class="winner-phone">👑 +${winnerPhone}</div>
                        <div style="font-size: 12px; color: var(--wa-subtext); line-height: 1.5;">
                            Congratulations! Message the admin on WhatsApp to receive your cash reward.
                        </div>
                        <a href="https://wa.me/${WHATSAPP_NUMBER}?text=${msg}" target="_blank" class="btn-claim">
                            💬 Message Admin (+${WHATSAPP_NUMBER}) to Get Paid
                        </a>
                    </div>
                `;
            } else {
                winnerDiv.innerHTML = `
                    <div class="winner-screen" style="border-color: var(--wa-divider); background: rgba(255, 255, 255, 0.03);">
                        <div class="trophy-icon">🎮</div>
                        <div class="winner-title" style="color: var(--wa-text);">MATCH COMPLETED</div>
                        <div style="font-size: 13px; color: var(--wa-subtext);">The last remaining survivor was:</div>
                        <div class="winner-phone">👑 +${winnerPhone}</div>
                        <div style="font-size: 12px; color: var(--wa-subtext); line-height: 1.5; margin-top: 8px;">
                            This match has concluded. Only the winner has access to claim the reward.
                        </div>
                    </div>
                `;
            }
            return;
        }

        listDiv.style.display = 'flex';
        winnerDiv.style.display = 'none';
        listDiv.innerHTML = '';

        if (players.length === 0) {
            listDiv.innerHTML = '<div style="color: var(--wa-subtext); padding: 20px; text-align: center; font-size: 13px;">No active players currently in this group lobby.</div>';
            return;
        }

        players.forEach(player => {
            const phoneStr = player.phone_number || `Player #${player.id}`;
            const item = document.createElement('div');
            item.className = 'member-item';
            item.onclick = () => openOptionModal(player.id, phoneStr);
            item.innerHTML = `
                <div class="avatar">👤</div>
                <div class="member-info">
                    <div class="member-phone">+${phoneStr}</div>
                </div>
            `;
            listDiv.appendChild(item);
        });
    }

    function openOptionModal(id, phone) {
        if (!isCurrentUserAlive) {
            showToast("❌ You have already been eliminated from the group! All you can do is wait for the game to end.");
            return;
        }

        const now = Date.now();
        if (now < cooldownEndTime) {
            const secondsLeft = Math.ceil((cooldownEndTime - now) / 1000);
            showToast(`⏳ Cooldown active! Wait ${secondsLeft}s before removing another player.`);
            return;
        }

        selectedPlayerId = id;
        selectedPlayerPhone = phone;
        document.getElementById('modal-phone').innerText = `+${phone}`;
        document.getElementById('option-modal').style.display = 'flex';
    }

    function openConfirmModal() {
        document.getElementById('option-modal').style.display = 'none';
        document.getElementById('confirm-text').innerText = `Remove +${selectedPlayerPhone} from this group?`;
        document.getElementById('confirm-modal').style.display = 'flex';
    }

    function closeConfirmModal() {
        document.getElementById('confirm-modal').style.display = 'none';
    }

    function closeModals(e) {
        document.getElementById('option-modal').style.display = 'none';
        document.getElementById('confirm-modal').style.display = 'none';
    }

    async function executeRemoval() {
        closeConfirmModal();

        cooldownEndTime = Date.now() + 3000;

        await dbClient
            .from('leads')
            .update({ is_active: false })
            .eq('id', selectedPlayerId);

        showToast(`+${selectedPlayerPhone} was removed from the group.`);
        fetchPlayers();
    }

    function showToast(text) {
        const toast = document.getElementById('toast-msg');
        toast.innerText = text;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 3500);
    }

    fetchPlayers();
    setInterval(fetchPlayers, 3000);
</script>

</body>
</html>
