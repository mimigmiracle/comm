<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Whats Survival | Waiting Room</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b141a;
            --card-bg: #111b21;
            --accent-gold: #ffd700;
            --text-main: #e9edef;
            --text-sub: #8696a0;
            --success: #00a884;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 28px 20px;
            text-align: center;
        }

        .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
        .header p { font-size: 13px; color: var(--text-sub); }

        .timer-box {
            background: #182229;
            border: 1px dashed rgba(255, 215, 0, 0.4);
            border-radius: 16px;
            padding: 20px 10px;
        }

        .timer-label { font-size: 12px; text-transform: uppercase; color: var(--text-sub); margin-bottom: 8px; }
        .countdown { font-size: 36px; font-weight: 800; color: var(--accent-gold); letter-spacing: 2px; }

        .btn-play {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 16px;
            background: var(--success);
            color: #ffffff;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: none;
            box-shadow: 0 4px 15px rgba(0, 168, 132, 0.4);
        }

        .btn-play.active { display: block; }
        .waiting-status { font-size: 14px; color: var(--text-sub); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>⚔️ Whats Survival</h1>
        <p>Lobby Verified • Daily Match at 8:00 PM</p>
    </div>

    <div class="timer-box">
        <div class="timer-label">Match Starts In</div>
        <div class="countdown" id="countdown">00:00:00</div>
    </div>

    <div class="waiting-status" id="waiting-status">
        ⏳ Stand by for game launcher...
    </div>

    <a href="game.html" class="btn-play" id="btn-play">
        PLAY GAME NOW 🎮
    </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://eupaqmrilobhvmbpvpuw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_PjtLrDn-bHNoz9hm5FM_yQ_LI8NUxrU';
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const userPhone = localStorage.getItem('user_phone') || '';

    async function checkAccess() {
        if (!userPhone) {
            window.location.href = 'login.html';
            return;
        }

        const { data } = await dbClient
            .from('leads')
            .select('is_active')
            .eq('phone_number', userPhone)
            .maybeSingle();

        if (!data || data.is_active !== true) {
            window.location.href = 'payment.html';
        }
    }

    function getNextMatchTime() {
        const matchTime = new Date();
        matchTime.setHours(20, 0, 0, 0); // 8:00 PM
        if (new Date() >= matchTime) {
            matchTime.setDate(matchTime.getDate() + 1);
        }
        return matchTime.getTime();
    }

    const targetTime = getNextMatchTime();

    function updateTimer() {
        const difference = targetTime - new Date().getTime();

        if (difference <= 0) {
            document.getElementById('countdown').innerText = "00:00:00";
            document.getElementById('waiting-status').style.display = 'none';
            document.getElementById('btn-play').classList.add('active');
            return;
        }

        const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((difference % (1000 * 60)) / 1000);
        const pad = (n) => n.toString().padStart(2, '0');

        document.getElementById('countdown').innerText = `${pad(h)}:${pad(m)}:${pad(s)}`;
    }

    checkAccess();
    updateTimer();
    setInterval(updateTimer, 1000);
</script>

</body>
</html>
