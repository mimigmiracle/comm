<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whats Survival | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b141a;
            --card-bg: #111b21;
            --accent-gold: #ffd700;
            --text-main: #e9edef;
            --text-sub: #8696a0;
            --success: #00a884;
            --wa-red: #f15c6d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 24px 20px;
        }

        .login-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .brand-title { font-size: 22px; font-weight: 800; color: #ffffff; }
        .subtitle { font-size: 13px; color: var(--text-sub); }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        label {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-gold);
        }

        input[type="tel"] {
            width: 100%;
            padding: 14px;
            background: #182229;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
        }

        input[type="tel"]:focus {
            border-color: var(--accent-gold);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            background: linear-gradient(135deg, #ffd700, #cca600);
            color: #000000;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="login-header">
        <div class="brand-title">⚔️ Whats Survival</div>
        <div class="subtitle">Enter your phone number to proceed</div>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="e.g. 2348012345678" required />
        </div>
        <button type="submit" class="btn-login" id="submit-btn">Continue to Lobbies 🚀</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://eupaqmrilobhvmbpvpuw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_PjtLrDn-bHNoz9hm5FM_yQ_LI8NUxrU';
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Auto-redirect if already logged in
    if (localStorage.getItem('user_phone')) {
        window.location.href = 'index.html';
    }

    async function handleLogin(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submit-btn');
        let phoneInput = document.getElementById('phone').value.trim();

        phoneInput = phoneInput.replace(/\D/g, '');

        if (phoneInput.length < 10) {
            alert('Please enter a valid phone number');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = 'Connecting...';

        try {
            // Log new user lead with is_active: false and payment_reference: null
            await dbClient.from('leads').upsert([
                {
                    phone_number: phoneInput,
                    is_active: false,
                    payment_reference: null
                }
            ], { onConflict: 'phone_number' });

            localStorage.setItem('user_phone', phoneInput);
            window.location.href = 'index.html';
        } catch (err) {
            console.error('Login error:', err);
            localStorage.setItem('user_phone', phoneInput);
            window.location.href = 'index.html';
        }
    }
</script>

</body>
</html>
