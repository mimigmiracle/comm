<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Whats Survival | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b141a;
            --card-bg: #111b21;
            --accent-gold: #ffd700;
            --text-main: #e9edef;
            --text-sub: #8696a0;
            --success: #00a884;
            --danger: #f15c6d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 28px 20px;
            text-align: center;
        }

        .header h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
        .header p { font-size: 13px; color: var(--text-sub); }

        .input-group {
            display: flex;
            background: #182229;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            overflow: hidden;
        }

        .country-code {
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent-gold);
            font-weight: 700;
            font-size: 14px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .phone-input {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-size: 16px;
            font-weight: 600;
        }

        .btn-action {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            background: var(--accent-gold);
            color: #000;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-action.active-paid {
            background: var(--success);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>⚔️ Whats Survival</h1>
        <p>Enter your registered phone number to join lobby</p>
    </div>

    <div class="input-group">
        <span class="country-code">+234</span>
        <input type="tel" id="phone-number" class="phone-input" placeholder="8012345678" maxlength="10">
    </div>

    <button class="btn-action" id="btn-submit" onclick="handleLogin()">
        Check Status 🔍
    </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://eupaqmrilobhvmbpvpuw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_PjtLrDn-bHNoz9hm5FM_yQ_LI8NUxrU';
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function handleLogin() {
        let input = document.getElementById('phone-number').value.trim();
        if (input.startsWith('0')) input = input.substring(1);
        if (!input || input.length < 10) {
            alert('Please enter a valid phone number');
            return;
        }

        const fullPhone = '234' + input;
        localStorage.setItem('user_phone', fullPhone);

        const { data } = await dbClient
            .from('leads')
            .select('is_active')
            .eq('phone_number', fullPhone)
            .maybeSingle();

        if (data && data.is_active === true) {
            window.location.href = 'wait.html';
        } else {
            window.location.href = 'payment.html';
        }
    }
</script>
</body>
</html>
