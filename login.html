<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Whats Survival | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b141a;
            --card-bg: #111b21;
            --accent-gold: #ffd700;
            --text-main: #e9edef;
            --text-sub: #8696a0;
            --success: #00a884;
            --wa-red: #f15c6d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            /* Removed overflow: hidden so dropdown is never cut off */
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 24px 20px;
            position: relative;
        }

        .login-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .brand-title { font-size: 22px; font-weight: 800; color: #ffffff; }
        .subtitle { font-size: 13px; color: var(--text-sub); }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }

        label {
            font-size: 12px;
            font-weight: 700;
            color: var(--accent-gold);
        }

        .phone-input-wrapper {
            display: flex;
            gap: 8px;
            position: relative;
        }

        .country-picker {
            position: relative;
        }

        /* Set to 16px font-size to prevent iPhone auto-zoom */
        .country-btn {
            width: 125px;
            padding: 14px 10px;
            background: #182229;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
            height: 100%;
        }

        .country-btn:focus, .country-btn.active {
            border-color: var(--accent-gold);
        }

        /* Dropdown positioning & high z-index */
        .country-dropdown {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            width: 280px;
            background: #182229;
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            z-index: 9999;
            flex-direction: column;
            overflow: hidden;
        }

        .country-dropdown.show {
            display: flex;
        }

        .country-search-box {
            padding: 10px;
            background: #111b21;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* 16px font-size prevents iOS zoom when typing search */
        .country-search-box input {
            width: 100%;
            padding: 10px 12px;
            background: #182229;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
        }

        .country-search-box input:focus {
            border-color: var(--accent-gold);
        }

        .country-list {
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .country-item {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            cursor: pointer;
            color: var(--text-main);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.15s ease;
        }

        .country-item:hover {
            background: rgba(255, 215, 0, 0.15);
            color: var(--accent-gold);
        }

        .country-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .country-code-text {
            color: var(--text-sub);
            font-weight: 700;
        }

        /* 16px font-size prevents iOS zoom on phone field */
        input[type="tel"] {
            flex: 1;
            padding: 14px;
            background: #182229;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
        }

        input[type="tel"]:focus {
            border-color: var(--accent-gold);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 15px;
            background: linear-gradient(135deg, #ffd700, #cca600);
            color: #000000;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>

    function renderCountries(list) {
        const countryListEl = document.getElementById('country-list');
        countryListEl.innerHTML = '';

        if (list.length === 0) {
            countryListEl.innerHTML = '<div class="country-item" style="color:var(--text-sub); cursor:default;">No country found</div>';
            return;
        }

        list.forEach(c => {
            const item = document.createElement('div');
            item.className = 'country-item';
            item.onclick = () => selectCountry(c);
            item.innerHTML = `
                <div class="country-name">
                    <span>${c.flag}</span>
                    <span>${c.name}</span>
                </div>
                <div class="country-code-text">+${c.code}</div>
            `;
            countryListEl.appendChild(item);
        });
    }

    function toggleDropdown() {
        const dropdown = document.getElementById('country-dropdown');
        const btn = document.getElementById('country-btn');
        const searchInput = document.getElementById('country-search');

        dropdown.classList.toggle('show');
        btn.classList.toggle('active');

        if (dropdown.classList.contains('show')) {
            searchInput.value = '';
            renderCountries(countries);
            setTimeout(() => searchInput.focus(), 100);
        }
    }

    function filterCountries() {
        const query = document.getElementById('country-search').value.toLowerCase().trim();
        const filtered = countries.filter(c => 
            c.name.toLowerCase().includes(query) || c.code.includes(query)
        );
        renderCountries(filtered);
    }

    function selectCountry(c) {
        document.getElementById('country-code').value = c.code;
        document.getElementById('selected-country-text').innerText = `${c.flag} +${c.code}`;
        
        document.getElementById('country-dropdown').classList.remove('show');
        document.getElementById('country-btn').classList.remove('active');

        // Re-check payment status when country changes
        checkPaymentStatus();
        document.getElementById('phone').focus();
    }

    document.addEventListener('click', (e) => {
        const picker = document.querySelector('.country-picker');
        if (!picker.contains(e.target)) {
            document.getElementById('country-dropdown').classList.remove('show');
            document.getElementById('country-btn').classList.remove('active');
        }
    });

                    .from('leads')
                    .select('is_active')
                    .eq('phone_number', fullPhone)
                    .maybeSingle();

                if (data && data.is_active === true) {
                    isPaidUser = true;
                    submitBtn.innerText = 'Enter Lobbies 🚀';
                    submitBtn.style.background = 'linear-gradient(135deg, #00a884, #008f70)';
                } else {
                    isPaidUser = false;
                    submitBtn.innerText = 'Pay Entry Fee to Access 💳';
                    submitBtn.style.background = 'linear-gradient(135deg, #ffd700, #cca600)';
                }
            } catch (err) {
                console.error("Supabase check error:", err);
            }
        }
    }

    document.getElementById('phone').addEventListener('input', checkPaymentStatus);

    async function handleLogin(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submit-btn');
        const countryCode = document.getElementById('country-code').value;
        let phoneInput = document.getElementById('phone').value.trim().replace(/\D/g, '');

        if (phoneInput.startsWith('0')) phoneInput = phoneInput.substring(1);

        if (phoneInput.length < 7) {
            alert('Please enter a valid phone number');
            return;
        }

        const fullPhone = countryCode + phoneInput;
        submitBtn.disabled = true;

        if (isPaidUser) {
            localStorage.setItem('user_phone', fullPhone);
            window.location.href = 'index.html';
        } else {
            await dbClient.from('leads').upsert([
                { phone_number: fullPhone, is_active: false }
            ], { onConflict: 'phone_number' });

            localStorage.setItem('user_phone', fullPhone);
            window.location.href = 'payment.html'; // Change to your Paystack/Payment link
        }
    }
</script>
