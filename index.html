<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whats Survival | Tournament Lobbies</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b141a;
            --card-bg: #111b21;
            --accent-gold: #ffd700;
            --text-main: #e9edef;
            --text-sub: #8696a0;
            --success: #00a884;
            --wa-red: #f15c6d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 10px;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 20px;
        }

        .app-header {
            padding: 16px 20px;
            background: #202c33;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-title { font-size: 18px; font-weight: 800; color: #ffffff; }
        .user-phone { font-size: 12px; color: var(--text-sub); }
        .logout-btn { color: var(--wa-red); font-size: 12px; font-weight: 700; text-decoration: none; cursor: pointer; }

        .content-body { padding: 0 16px; display: flex; flex-direction: column; gap: 16px; }

        .lobby-card {
            background: #182229;
            border-radius: 16px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .lobby-header { display: flex; justify-content: space-between; align-items: center; }
        .lobby-title { font-size: 15px; font-weight: 700; color: var(--accent-gold); }

        .counter-badge {
            background: rgba(255, 215, 0, 0.1);
            color: var(--accent-gold);
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
        }

        .btn-pay, .btn-registered, .btn-play-game {
            display: block;
            width: 100%;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-pay {
            background: linear-gradient(135deg, #ffd700, #cca600);
            color: #000000;
        }

        .btn-registered {
            background: rgba(0, 168, 132, 0.15);
            border: 1px solid var(--success);
            color: var(--success);
            cursor: not-allowed;
        }

        .btn-play-game {
            background: var(--success);
            color: #000000;
            box-shadow: 0 4px 12px rgba(0, 168, 132, 0.4);
        }

        .arena-action-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
        }

        .countdown-text { font-size: 12px; color: var(--text-sub); }
        .countdown-text span { color: var(--accent-gold); font-weight: 800; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <div>
            <div class="brand-title">⚔️ Whats Survival</div>
            <div class="user-phone" id="display-phone">+234 ...</div>
        </div>
        <div class="logout-btn" onclick="logout()">Logout</div>
    </div>

    <div class="content-body">
        <!-- ₦1,000 LOBBY CARD -->
        <div class="lobby-card">
            <div class="lobby-header">
                <div class="lobby-title">🏆 ₦500k Grand Battle (₦1,000)</div>
                <div class="counter-badge"><span id="count-1000">0</span> Registered</div>
            </div>
            
            <button class="btn-pay" id="pay-btn-1000" onclick="startPayment('100000', 'https://paystack.shop/pay/trr5o190ig')">Pay ₦1,000 & Join Lobby</button>
            <div class="btn-registered" id="paid-badge-1000" style="display:none;">✅ Registered! Starts at 8:00 PM</div>

            <div class="arena-action-box" id="timer-box-1000">
                <div class="countdown-text">Starts in: <span id="time-1000">Loading...</span></div>
            </div>

            <a href="game.html?tier=100000" class="btn-play-game" id="play-btn-1000" style="display:none;">🎮 Enter ₦1,000 Arena</a>
        </div>

        <!-- ₦100 LOBBY CARD -->
        <div class="lobby-card">
            <div class="lobby-header">
                <div class="lobby-title">⚡ ₦50k Sprint Battle (₦100)</div>
                <div class="counter-badge"><span id="count-100">0</span> Registered</div>
            </div>
            
            <button class="btn-pay" id="pay-btn-100" onclick="startPayment('10000', 'https://paystack.shop/pay/4axl-x3e50')">Pay ₦100 & Join Lobby</button>
            <div class="btn-registered" id="paid-badge-100" style="display:none;">✅ Registered! Starts at 8:00 PM</div>

            <div class="arena-action-box" id="timer-box-100">
                <div class="countdown-text">Starts in: <span id="time-100">Loading...</span></div>
            </div>

            <a href="game.html?tier=10000" class="btn-play-game" id="play-btn-100" style="display:none;">🎮 Enter ₦100 Arena</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const activePhone = localStorage.getItem('user_phone');
    if (!activePhone) {
        window.location.href = 'login.html';
    } else {
        document.getElementById('display-phone').innerText = '+' + activePhone;
    }

    function logout() {
        localStorage.removeItem('user_phone');
        window.location.href = 'login.html';
    }

    const SUPABASE_URL = 'https://eupaqmrilobhvmbpvpuw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_PjtLrDn-bHNoz9hm5FM_yQ_LI8NUxrU';
    const dbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Save pending tier state before redirecting to Paystack
    function startPayment(tier, url) {
        localStorage.setItem('pending_payment_tier', tier);
        window.location.href = url;
    }

    // 1. Process Return from Paystack
    const urlParams = new URLSearchParams(window.location.search);
    const reference = urlParams.get('reference') || urlParams.get('trxref');
    const returnedTier = urlParams.get('tier');
    const pendingTier = localStorage.getItem('pending_payment_tier');

    const finalTier = returnedTier || pendingTier;

    if ((reference || urlParams.get('paid') === 'true') && finalTier) {
        const todayStr = new Date().toISOString().split('T')[0];
        localStorage.setItem(`paid_tier_${finalTier}`, todayStr);
        localStorage.removeItem('pending_payment_tier');
        
        // Save lead and attach payment reference
        dbClient.from('leads').upsert(
            [{ 
                phone_number: activePhone, 
                tier: finalTier, 
                is_active: true,
                payment_reference: reference || null
            }],
            { onConflict: 'phone_number,tier' }
        ).then(() => {
            window.history.replaceState({}, document.title, window.location.pathname);
            updateStateEngine();
        });
    }

    // 2. Cross-device sync: Query Supabase ONLY for verified payments
    async function syncDatabasePaidStatus() {
        if (!activePhone) return;
        const { data: userLeads } = await dbClient
            .from('leads')
            .select('tier')
            .eq('phone_number', activePhone)
            .eq('is_active', true)
            .not('payment_reference', 'is', null);

        if (userLeads && userLeads.length > 0) {
            const todayStr = new Date().toISOString().split('T')[0];
            userLeads.forEach(lead => {
                localStorage.setItem(`paid_tier_${lead.tier}`, todayStr);
            });
            updateStateEngine();
        }
    }

    // 3. State & Countdown Engine (Controls button visibility & time logic)
    function updateStateEngine() {
        const now = new Date();
        const currentHour = now.getHours();
        const todayStr = now.toISOString().split('T')[0];

        // Game active strictly between 8:00 PM (20:00) and 9:00 PM (21:00)
        const isMatchActive = (currentHour >= 20 && currentHour < 21);

        // Calculate target time for countdown (8:00 PM)
        const target = new Date();
        target.setHours(20, 0, 0, 0);
        if (currentHour >= 21) {
            target.setDate(target.getDate() + 1);
        }

        const distance = target.getTime() - now.getTime();
        let timeFormatted = "LIVE NOW";

        if (distance > 0 && !isMatchActive) {
            const h = Math.floor((distance / (1000 * 60 * 60)) % 24).toString().padStart(2, '0');
            const m = Math.floor((distance / (1000 * 60)) % 60).toString().padStart(2, '0');
            const s = Math.floor((distance / 1000) % 60).toString().padStart(2, '0');
            timeFormatted = `${h}:${m}:${s}`;
        }

        document.getElementById('time-1000').innerText = timeFormatted;
        document.getElementById('time-100').innerText = timeFormatted;

        // Tier Mappings
        const tiers = [
            { id: '1000', dbTier: '100000' },
            { id: '100', dbTier: '10000' }
        ];

        tiers.forEach(t => {
            const paidDate = localStorage.getItem(`paid_tier_${t.dbTier}`);
            
            let isPaid = false;
            if (paidDate === todayStr) {
                isPaid = true;
            } else if (paidDate && paidDate !== todayStr && currentHour >= 21) {
                // Clear past session data safely after 9 PM
                localStorage.removeItem(`paid_tier_${t.dbTier}`);
            }

            const payBtn = document.getElementById(`pay-btn-${t.id}`);
            const paidBadge = document.getElementById(`paid-badge-${t.id}`);
            const playBtn = document.getElementById(`play-btn-${t.id}`);
            const timerBox = document.getElementById(`timer-box-${t.id}`);

            if (isMatchActive && isPaid) {
                // STEP 3: PLAY GAME (8 PM - 9 PM)
                payBtn.style.display = 'none';
                paidBadge.style.display = 'none';
                timerBox.style.display = 'none';
                playBtn.style.display = 'block';
            } else if (isPaid && !isMatchActive) {
                // STEP 2: REGISTERED & WAITING FOR 8 PM
                payBtn.style.display = 'none';
                playBtn.style.display = 'none';
                paidBadge.style.display = 'block';
                timerBox.style.display = 'block';
            } else {
                // STEP 1: DEFAULT / UNPAID
                paidBadge.style.display = 'none';
                playBtn.style.display = 'none';
                payBtn.style.display = 'block';
                timerBox.style.display = 'block';
            }
        });
    }

    // 4. Load live player counts (only counting completed payments)
    async function loadCounts() {
        const [c1000, c100] = await Promise.all([
            dbClient.from('leads')
                .select('*', { count: 'exact', head: true })
                .eq('tier', '100000')
                .eq('is_active', true)
                .not('payment_reference', 'is', null),
            dbClient.from('leads')
                .select('*', { count: 'exact', head: true })
                .eq('tier', '10000')
                .eq('is_active', true)
                .not('payment_reference', 'is', null)
        ]);

        if (c1000.count !== null) document.getElementById('count-1000').innerText = c1000.count;
        if (c100.count !== null) document.getElementById('count-100').innerText = c100.count;
    }

    // Execution Loops
    syncDatabasePaidStatus();
    updateStateEngine();
    loadCounts();

    setInterval(updateStateEngine, 1000);
    setInterval(loadCounts, 5000);
</script>

</body>
</html>
