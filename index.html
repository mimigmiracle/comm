<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby - WhatsApp Survival</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wa-bg: #0b141a;
            --wa-card: #111b21;
            --wa-header: #202c33;
            --wa-text: #e9edef;
            --wa-subtext: #8696a0;
            --wa-green: #00a884;
            --wa-divider: #222d34;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--wa-bg);
            color: var(--wa-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .wa-screen {
            width: 100%;
            max-width: 440px;
            background: var(--wa-card);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px 16px;
            gap: 20px;
        }

        .user-bar {
            background: var(--wa-header);
            padding: 14px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--wa-divider);
        }

        .user-phone { font-size: 14px; font-weight: 600; }
        .logout-btn { color: #f15c6d; text-decoration: none; font-size: 13px; font-weight: 600; cursor: pointer; }

        .section-title { font-size: 16px; font-weight: 700; margin-top: 10px; }

        .tier-card {
            background: var(--wa-header);
            border: 1px solid var(--wa-divider);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-decoration: none;
            color: var(--wa-text);
            transition: border-color 0.2s;
        }

        .tier-card:hover { border-color: var(--wa-green); }

        .tier-badge {
            align-self: flex-start;
            background: rgba(0, 168, 132, 0.15);
            color: var(--wa-green);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .tier-name { font-size: 18px; font-weight: 700; }
        .tier-desc { font-size: 12px; color: var(--wa-subtext); }
        .btn-enter {
            background: var(--wa-green);
            color: #000;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            font-size: 13px;
            margin-top: 4px;
        }
    </style>
</head>
<body>

<div class="wa-screen">
    <div class="user-bar">
        <div>
            <div style="font-size: 11px; color: var(--wa-subtext);">Logged in as</div>
            <div class="user-phone" id="display-phone">+234 ...</div>
        </div>
        <div class="logout-btn" onclick="logout()">Logout</div>
    </div>

    <div class="section-title">Select Battle Arena</div>

    <a href="game.html?tier=10000" class="tier-card">
        <div class="tier-badge">FAST MATCH</div>
        <div class="tier-name">₦50k Sprint Battle</div>
        <div class="tier-desc">Standard survival mode. Last remaining player claims the prize pool.</div>
        <div class="btn-enter">Enter Arena</div>
    </a>

    <a href="game.html?tier=100000" class="tier-card">
        <div class="tier-badge" style="background: rgba(226, 160, 63, 0.15); color: #e2a03f;">GRAND MATCH</div>
        <div class="tier-name">₦500k Grand Battle</div>
        <div class="tier-desc">High stakes match. Outlast all opponents to reach the admin claim portal.</div>
        <div class="btn-enter" style="background: #e2a03f;">Enter Arena</div>
    </a>
</div>

<script>
    const activePhone = localStorage.getItem('user_phone');
    if (!activePhone) {
        window.location.href = 'login.html';
    } else {
        document.getElementById('display-phone').innerText = '+' + activePhone;
    }

    function logout() {
        localStorage.removeItem('user_phone');
        window.location.href = 'login.html';
    }
</script>

</body>
</html>
